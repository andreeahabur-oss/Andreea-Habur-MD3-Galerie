    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- === INTEGRARE GEMINI API === -->
    <script>
      const apiKey = ""; // Va fi injectat de mediu la runtime
      let curentPaintingName = "";

      // Funcție robustă pentru a apela Gemini cu Exponential Backoff
      async function fetchGeminiWithRetry(prompt, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: "Ești un curator de artă expert la o galerie digitală Van Gogh. Ești poetic, concis și captivant." }] }
        };

        for (let i = 0; i < retries; i++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`Eroare HTTP: ${response.status}`);
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "Nu am putut genera un răspuns.";
          } catch (err) {
            if (i === retries - 1) return "Conexiunea la IA a eșuat. Vă rugăm să încercați din nou.";
            await new Promise(r => setTimeout(r, delays[i]));
          }
        }
      }

      // Feature 1: Cereală secrete despre tablou
      async function cereSecretAI() {
        if (!curentPaintingName) return;
        var infoText = document.querySelector('#info-text');
        infoText.setAttribute('value', "Curatorul AI analizeaza tabloul...\nAsteptati un moment ✨");
        
        const prompt = `Spune-mi o curiozitate foarte scurtă și interesantă, un detaliu tehnic sau un secret despre tabloul "${curentPaintingName}" de Vincent van Gogh. Fii foarte scurt (maxim 2-3 propoziții) și răspunde în limba română. Fără caractere de markdown precum asteriscuri.`;
        
        const raspuns = await fetchGeminiWithRetry(prompt);
        let cleanResponse = raspuns.replace(/\*\*/g, '').replace(/\*/g, '');
        infoText.setAttribute('value', `✨ Secret AI despre ${curentPaintingName}:\n\n${cleanResponse}`);
      }

      // Feature 2: Generare Poezie despre tablou
      async function cerePoezieAI() {
        if (!curentPaintingName) return;
        var infoText = document.querySelector('#info-text');
        infoText.setAttribute('value', "Gemini compune versuri...\nAsteptati un moment ✨");
        
        const prompt = `Scrie o poezie fix de 4 versuri inspirată vizual și emoțional de tabloul "${curentPaintingName}" de Vincent van Gogh. Limba: română. Fără caractere de markdown.`;
        
        const raspuns = await fetchGeminiWithRetry(prompt);
        let cleanResponse = raspuns.replace(/\*\*/g, '').replace(/\*/g, '');
        infoText.setAttribute('value', `✨ Poezie AI (${curentPaintingName}):\n\n${cleanResponse}`);
      }

      // Controlul Panoului de Info
      function deschideInfo(numeTablou, descriere, pos, rot) {
        curentPaintingName = numeTablou;
        var info = document.querySelector('#info-box');
        document.querySelector('#info-text').setAttribute('value', descriere);
        info.setAttribute('visible', 'true');
        info.setAttribute('position', pos);
        info.setAttribute('rotation', rot);
      }

      function inchideInfo() {
        document.querySelector('#info-box').setAttribute('visible', 'false');
        curentPaintingName = "";
      }
    </script>

    <!-- 2. SCRIPTUL PENTRU LIMITAREA CAMEREI -->
    <script>
      AFRAME.registerComponent('billboard', {
        tick: function () {
          var cameraEl = document.querySelector('a-camera');
          if (!cameraEl) return;
          var camPos = cameraEl.getAttribute('position');
          var thisPos = this.el.getAttribute('position');
          var dx = camPos.x - thisPos.x;
          var dz = camPos.z - thisPos.z;
          var angle = Math.atan2(dx, dz) * (180 / Math.PI);
          this.el.setAttribute('rotation', '0 ' + angle + ' 0');
        }
      });

      AFRAME.registerComponent('limit-movement', {
        init: function () {
          this.lastPos = { 
            x: this.el.getAttribute('position').x, 
            z: this.el.getAttribute('position').z 
          };
        },
        tick: function () {
          var pos = this.el.getAttribute('position');

          if (pos.x < -8.5) pos.x = -8.5;
          if (pos.x > 8.5) pos.x = 8.5;
          if (pos.z < -6.5) pos.z = -6.5;
          if (pos.z > 6.5) pos.z = 6.5;

          var wallMinX = -0.55, wallMaxX = 0.55;
          var wallMinZ = -7.5,  wallMaxZ = 2.5;

          if (pos.x > wallMinX && pos.x < wallMaxX && 
              pos.z > wallMinZ && pos.z < wallMaxZ) {
            if (this.lastPos.x <= wallMinX) {
              pos.x = wallMinX;
            } else if (this.lastPos.x >= wallMaxX) {
              pos.x = wallMaxX;
            } else if (this.lastPos.z <= wallMinZ) {
              pos.z = wallMinZ;
            } else if (this.lastPos.z >= wallMaxZ) {
              pos.z = wallMaxZ;
            } else {
              var dMinX = Math.abs(pos.x - wallMinX);
              var dMaxX = Math.abs(pos.x - wallMaxX);
              var dMinZ = Math.abs(pos.z - wallMinZ);
              var dMaxZ = Math.abs(pos.z - wallMaxZ);
              var minD = Math.min(dMinX, dMaxX, dMinZ, dMaxZ);
              if (minD === dMinX) pos.x = wallMinX;
              else if (minD === dMaxX) pos.x = wallMaxX;
              else if (minD === dMinZ) pos.z = wallMinZ;
              else pos.z = wallMaxZ;
            }
          }
          this.lastPos = { x: pos.x, z: pos.z };
          this.el.setAttribute('position', pos);
        }
      });
    </script>

    <!-- 3. SCRIPTUL PENTRU VIZITATOR (CALUGAR) -->
    <script>
      AFRAME.registerComponent('vizitator', {
        init: async function () {
          this.traseu = [
            { x: -8, z: 2, rot: -90, wait: true },     
            { x: -8, z: -1.5, rot: -90, wait: true },  
            { x: -5, z: -5.5, rot: 180, wait: true },  
            { x: -5, z: 5.5, rot: 0, wait: true },     
            { x: 5, z: 5.5, rot: 0, wait: true },      
            { x: 8, z: 2, rot: 90, wait: true },       
            { x: 8, z: -1.5, rot: 90, wait: true },    
            { x: 5, z: -5.5, rot: 180, wait: true },   
            { x: 5, z: 3.5, rot: 180, wait: false },   
            { x: -5, z: 3.5, rot: 180, wait: false }   
          ];
          
          // Replicile initiale in caz de fallback
          this.mesaje = [
            "Ce capodoperă! Priviti cum lumina dansează pe pânză!",
            "Fiecare tablou spune o poveste despre lupta interioară a lui Vincent.",
            "Observati tușele energice, specifice stilului post-impresionist."
          ];
          
          this.indexCurent = 0;
          this.el.setAttribute('position', '-5 0 2');
          this.el.setAttribute('rotation', '0 0 0');
          
          this.speechBubble = document.createElement('a-entity');
          this.speechBubble.setAttribute('id', 'calugar-speech');
          this.speechBubble.setAttribute('position', '-5 2.3 2');
          this.speechBubble.setAttribute('billboard', '');
          this.speechBubble.innerHTML = `
            <a-plane width="2.8" height="0.8" color="#FFF" opacity="0.95" side="double" position="0 0 0">
              <a-text id="calugar-text" value="Analizez capodoperele..." align="center" width="2.4" color="#222" position="0 0 0.01" wrap-count="35"></a-text>
            </a-plane>
            <a-cone color="#FFF" opacity="0.95" radius-bottom="0.1" radius-top="0" height="0.2" position="0 -0.5 0" rotation="0 0 180"></a-cone>
          `;
          this.speechBubble.setAttribute('visible', false);
          this.el.sceneEl.appendChild(this.speechBubble);
          this.speechText = this.speechBubble.querySelector('#calugar-text');
          
          // Feature 3: Gemini Populeaza dinamic gandurile vizitatorului la inceput!
          this.incarcaRepliciAI();

          setTimeout(() => { this.mergiLaUrmatorul(); }, 3000);
        },

        incarcaRepliciAI: async function() {
          const prompt = "Scrie 5 replici scurte (maxim o frază) pe care le-ar spune cu voce tare un pasionat de artă în timp ce privește fascinat picturile lui Van Gogh într-o galerie. Oferă-le ca o listă simplă cu câte o replică pe linie. Fără bullet points.";
          const raspuns = await fetchGeminiWithRetry(prompt, 3); // Mai puține retry-uri pentru background task
          if(raspuns && !raspuns.startsWith("Conexiunea")) {
            const replici = raspuns.split('\n').map(l => l.replace(/^[-*0-9.]+\s*/, '').trim()).filter(l => l.length > 10);
            if(replici.length > 0) {
               this.mesaje = replici;
            }
          }
        },
        
        tick: function() {
          if(this.speechBubble && this.speechBubble.getAttribute('visible')) {
            var pos = this.el.getAttribute('position');
            this.speechBubble.setAttribute('position', pos.x + ' 2.3 ' + pos.z);
          }
        },
        
        showSpeech: function() {
          var msg = this.mesaje[Math.floor(Math.random() * this.mesaje.length)];
          this.speechText.setAttribute('value', msg);
          this.speechBubble.setAttribute('visible', true);
          var pos = this.el.getAttribute('position');
          this.speechBubble.setAttribute('position', pos.x + ' 2.3 ' + pos.z);
        },
        
        hideSpeech: function() {
          this.speechBubble.setAttribute('visible', false);
        },
        
        mergiLaUrmatorul: function () {
          let end = this.traseu[this.indexCurent];
          let pos = this.el.getAttribute('position');
          
          let dx = end.x - pos.x;
          let dz = end.z - pos.z;
          let unghiDeMers = Math.atan2(dx, dz) * (180 / Math.PI);
          let distanta = Math.sqrt(dx*dx + dz*dz);
          let timpMers = Math.floor(distanta * 1500);
          
          this.hideSpeech();
          
          this.el.setAttribute('animation__intoarcere', `property: rotation; to: 0 ${unghiDeMers} 0; dur: 800; easing: easeInOutQuad`);
          
          setTimeout(() => {
            this.el.setAttribute('animation__mers', `property: position; to: ${end.x} 0 ${end.z}; dur: ${timpMers}; easing: linear`);
            
            setTimeout(() => {
              if (end.wait !== false) {
                this.el.setAttribute('animation__intoarcere2', `property: rotation; to: 0 ${end.rot} 0; dur: 800; easing: easeInOutQuad`);
                setTimeout(() => { this.showSpeech(); }, 800);
                setTimeout(() => {
                  this.hideSpeech();
                  this.indexCurent = (this.indexCurent + 1) % this.traseu.length;
                  this.mergiLaUrmatorul();
                }, 4000);
              } else {
                this.indexCurent = (this.indexCurent + 1) % this.traseu.length;
                this.mergiLaUrmatorul();
              }
            }, timpMers + 50);
          }, 850);
        }
      });
    </script>

    <!-- 4. SCRIPTUL PENTRU PISICA -->
    <script>
      AFRAME.registerComponent('pisica', {
        init: function () {
          this.traseu = [
            { x: -3, z: 4, rot: 0, wait: true },
            { x: 3, z: 4, rot: 0, wait: true },
            { x: 7, z: 0, rot: 90, wait: true },
            { x: 3, z: -4, rot: 180, wait: true },
            { x: -3, z: -4, rot: 180, wait: true },
            { x: -7, z: 0, rot: -90, wait: true },
            { x: 0, z: 3.5, rot: 180, wait: false }
          ];
          
          this.indexCurent = 0;
          this.el.setAttribute('position', '0 0 0');
          this.el.setAttribute('rotation', '0 0 0');
          this.el.setAttribute('scale', '1 1 1');
          
          this.poseEl = this.el.querySelector('#pisica-pose');
          setTimeout(() => { this.mergiLaUrmatorul(); }, 5000);
        },
        
        mergiLaUrmatorul: function () {
          let end = this.traseu[this.indexCurent];
          let pos = this.el.getAttribute('position');
          let dx = end.x - pos.x;
          let dz = end.z - pos.z;
          let unghiDeMers = Math.atan2(dx, dz) * (180 / Math.PI);
          let distanta = Math.sqrt(dx*dx + dz*dz);
          let timpMers = Math.floor(distanta * 2000);
          
          if (this.poseEl) {
            this.poseEl.removeAttribute('animation__sit');
            this.poseEl.removeAttribute('animation__sitpos');
            this.poseEl.setAttribute('rotation', '0 0 0');
            this.poseEl.setAttribute('position', '0 0 0');
          }
          
          this.el.setAttribute('animation__rot', `property: rotation; to: 0 ${unghiDeMers} 0; dur: 600; easing: easeInOutQuad`);
          
          setTimeout(() => {
            this.el.setAttribute('animation__mers', `property: position; to: ${end.x} 0 ${end.z}; dur: ${timpMers}; easing: linear`);
            
            setTimeout(() => {
              if (end.wait !== false) {
                this.el.setAttribute('animation__rot2', `property: rotation; to: 0 ${end.rot} 0; dur: 600; easing: easeInOutQuad`);
                setTimeout(() => {
                  if (this.poseEl) {
                    this.poseEl.setAttribute('animation__sit', 'property: rotation; to: -35 0 0; dur: 400; easing: easeInOutQuad');
                    this.poseEl.setAttribute('animation__sitpos', 'property: position; to: 0 0.06 0; dur: 400; easing: easeInOutQuad');
                  }
                  setTimeout(() => {
                    this.indexCurent = (this.indexCurent + 1) % this.traseu.length;
                    this.mergiLaUrmatorul();
                  }, 2500);
                }, 600);
              } else {
                this.indexCurent = (this.indexCurent + 1) % this.traseu.length;
                this.mergiLaUrmatorul();
              }
            }, timpMers + 50);
          }, 650);
        }
      });
    </script>
